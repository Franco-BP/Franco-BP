<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="140" viewBox="0 0 1200 140" role="img" aria-label="Thanks for stopping by — let's build something useful.">
  <title>Thanks for stopping by — let's build something useful.</title>
  
  <defs>
    <pattern id="f-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <radialGradient id="f-fade" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#fff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="f-mask"><rect width="1200" height="140" fill="url(#f-fade)"/></mask>
    <linearGradient id="f-text" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fafafa"/>
      <stop offset="100%" stop-color="#8a8a93"/>
    </linearGradient>
    <linearGradient id="f-beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="35%" stop-color="#22d3ee"/>
      <stop offset="65%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="f-meteor" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.9"/>
    </linearGradient>
    
    <radialGradient id="f-spot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#22d3ee" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="f-blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
    <clipPath id="f-clip"><rect width="1200" height="140" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#f-clip)">
    <rect width="1200" height="140" fill="#050507"/>
    <rect width="1200" height="140" fill="url(#f-grid)" mask="url(#f-mask)"/>
    <ellipse cx="600" cy="140" rx="360" ry="112" fill="url(#f-spot)" opacity="0.8">
      <animate attributeName="opacity" values="0.5;0.9;0.5" dur="7s" repeatCount="indefinite"/>
    </ellipse>
    
    <g transform="translate(0 23) rotate(145)" opacity="0">
      <rect width="129" height="1.2" rx="1" fill="url(#f-meteor)" transform="translate(-129 0)"/>
      <circle r="1.6" fill="#fff"/>
      <animateTransform attributeName="transform" type="translate" additive="sum" from="0 0" to="720 0" dur="5.5s" begin="1.1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.7;1" dur="5.5s" begin="1.1s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(790 35) rotate(145)" opacity="0">
      <rect width="80" height="1.2" rx="1" fill="url(#f-meteor)" transform="translate(-80 0)"/>
      <circle r="1.6" fill="#fff"/>
      <animateTransform attributeName="transform" type="translate" additive="sum" from="0 0" to="720 0" dur="4.1s" begin="3.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.7;1" dur="4.1s" begin="3.8s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(71 31) rotate(145)" opacity="0">
      <rect width="96" height="1.2" rx="1" fill="url(#f-meteor)" transform="translate(-96 0)"/>
      <circle r="1.6" fill="#fff"/>
      <animateTransform attributeName="transform" type="translate" additive="sum" from="0 0" to="720 0" dur="5.9s" begin="0.7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.7;1" dur="5.9s" begin="0.7s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(163 -15) rotate(145)" opacity="0">
      <rect width="73" height="1.2" rx="1" fill="url(#f-meteor)" transform="translate(-73 0)"/>
      <circle r="1.6" fill="#fff"/>
      <animateTransform attributeName="transform" type="translate" additive="sum" from="0 0" to="720 0" dur="3.2s" begin="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.7;1" dur="3.2s" begin="2.4s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(1013 4) rotate(145)" opacity="0">
      <rect width="89" height="1.2" rx="1" fill="url(#f-meteor)" transform="translate(-89 0)"/>
      <circle r="1.6" fill="#fff"/>
      <animateTransform attributeName="transform" type="translate" additive="sum" from="0 0" to="720 0" dur="5.2s" begin="4.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.7;1" dur="5.2s" begin="4.6s" repeatCount="indefinite"/>
    </g>
    <text x="50%" y="67.2" text-anchor="middle" font-family="'Inter', 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="-0.5" fill="url(#f-text)">Thanks for stopping by — let's build something useful.</text>
    <text x="50%" y="100.8" text-anchor="middle" font-family="'Inter', 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="4" fill="#71717a">PUNTA DEL ESTE  ·  URUGUAY</text>
    
    <rect x="-360" y="0.25" width="360" height="1.5" fill="url(#f-beam)">
      <animate attributeName="x" from="-360" to="1200" dur="5s" begin="0s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="139" rx="16" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
</svg>
